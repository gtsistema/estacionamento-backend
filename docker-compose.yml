services:
  api:
    container_name: estac_api
    build:
      context: .
      dockerfile: Estac.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=tcp:estacionamento-desenvolvimento.database.windows.net,1433;Initial Catalog=desenvolvimento;User=jeancorrea;Password=Transacao@34121;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
    depends_on:
      - db
    networks:
      - estac-network

  db:
    container_name: estac_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=@Admin2134
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - estac-network

networks:
  estac-network:

volumes:
  sql_data: