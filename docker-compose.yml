services:
  api:
    container_name: estac_api
    build:
      context: .
      dockerfile: Estac.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AutomaticRunDbMigrations=true
      - ConnectionStrings__DefaultConnection=Server=db;Database=gts-desenvolvimento;User=sa;Password=@Admin2134;TrustServerCertificate=True;
      - EstacionamentoWorkers__Enabled=true
      - EstacionamentoWorkers__BaseUrl=http://108.174.145.123:8081
      - EstacionamentoWorkers__TimeoutSeconds=15
    depends_on:
      - db
    networks:
      - estac-network
  db:
    container_name: estac_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=@Admin2134
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - estac-network
networks:
  estac-network:
volumes:
  sql_data: